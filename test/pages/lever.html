<!doctype html><html><head><meta charset="utf-8"><title>Lever</title></head><body>
<form id="application-form" class="application-form" method="post" action="/test/11111111-1111-1111-1111-111111111111/thanks" enctype="multipart/form-data">
 <div class="application-question"><div class="application-label">Resume/CV <span class="required">✱</span></div><input type="file" id="resume-upload-input" name="resume" required style="opacity:0;position:absolute;width:1px;height:1px"><span class="filename"></span></div>
 <div class="application-question"><div class="application-label">Full name ✱</div><input name="name" required></div>
 <div class="application-question"><div class="application-label">Email ✱</div><input name="email" type="email" required></div>
 <div class="application-question"><div class="application-label">Phone</div><input name="phone"></div>
 <div class="application-question"><div class="application-label">Current location</div><input id="location-input" name="location" autocomplete="off"><input type="hidden" name="selectedLocation"><div class="dropdown-results"></div></div>
 <div class="application-question"><div class="application-label">LinkedIn URL</div><input name="urls[LinkedIn]"></div>
 <div class="application-question custom-question"><div class="application-label">Will you now or in the future require sponsorship? ✱</div>
   <ul><li><label><input type="radio" name="cards[abc][field0]" value="Yes" required> Yes</label></li><li><label><input type="radio" name="cards[abc][field0]" value="No"> No</label></li></ul></div>
 <div class="application-question"><div class="application-label">Veteran status</div><select name="eeo[veteran]"><option value="">Select ...</option><option>I am a veteran</option><option>I am not a veteran</option><option>Decline to self-identify</option></select></div>
 <button id="btn-submit" type="submit">Submit application</button>
</form>
<script>
const li = document.getElementById("location-input"), res = document.querySelector(".dropdown-results");
document.getElementById("resume-upload-input").addEventListener("change", (e) => { document.querySelector(".filename").textContent = e.target.files[0]?.name || ""; });
li.addEventListener("input", () => { res.innerHTML = ""; if (li.value.length < 2) return;
  ["Chicago, Illinois, United States", "Chicago Heights, Illinois, United States"].filter(x => x.toLowerCase().startsWith(li.value.toLowerCase())).forEach(x => { const d = document.createElement("div"); d.className = "dropdown-location"; d.textContent = x;
    d.addEventListener("click", () => { li.value = x; document.querySelector("[name=selectedLocation]").value = x; res.innerHTML = ""; }); res.appendChild(d); }); });
</script></body></html>
